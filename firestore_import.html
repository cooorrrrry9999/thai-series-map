window.runImport = async function() {
  const log = document.getElementById('log');
  const btn = document.querySelector('button');
  btn.disabled = true;
  log.textContent = '';

  const add = (msg, cls='') => {
    const line = document.createElement('div');
    line.className = cls;
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  };

  try {
    add('📦 locations をインポート中...');
    for (const loc of LOCATIONS) {
      await setDoc(doc(db, 'locations', loc.id), loc);
      add(`  ✅ ${loc.id}: ${loc.name}`, 'ok');
    }

    add('');
    add('📦 appearances をインポート中...');
    for (const app of APPEARANCES) {
      await setDoc(doc(db, 'appearances', app.id), app);
      add(`  ✅ ${app.id}: ${app.series} / ${app.cp}`, 'ok');
    }

    add('');
    add('🎉 インポート完了！Firestoreコンソールで確認してください。', 'ok');
  } catch(e) {
    add(`❌ エラー: ${e.message}`, 'err');
    add('Firestoreのセキュリティルールで書き込みが拒否されている可能性があります。', 'err');
  }

  btn.disabled = false;
};
