<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thai Series Map — 管理者画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sw:200px;--white:#fff;--bg:#F8FAFC;--text:#111827;--sub:#6B7280;
  --border:#E5E7EB;--hover:#F3F4F6;
  --purple:#9333EA;--pl:#FAF5FF;--pb:#D8B4FE;
  --green:#059669;--red:#DC2626;--blue:#3B82F6;--amber:#D97706;
  --pink:#EC4899;
}
html,body{height:100%;font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

/* ── Auth gate ── */
#auth-gate{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.g-btn{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--border);border-radius:12px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:border-color .15s}
.g-btn:hover{border-color:var(--pb)}
.g-btn img{width:20px;height:20px}

/* ── Layout ── */
#admin-wrap{display:none;height:100%;flex-direction:row}
.sidebar{width:var(--sw);flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
.sb-logo{padding:16px 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-logo-title{font-size:13px;font-weight:900;color:var(--purple)}
.sb-logo-sub{font-size:10px;color:var(--sub);margin-top:1px}
.sb-nav{flex:1;padding:6px 0}
.sb-section{font-size:10px;font-weight:700;color:#bbb;letter-spacing:.1em;padding:10px 14px 3px}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:background .1s;text-decoration:none}
.sb-item:hover{background:var(--hover);color:var(--text)}
.sb-item.active{background:var(--pl);color:var(--purple);font-weight:700}
.sb-item .icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sb-badge{margin-left:auto;background:var(--pink);color:white;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.sb-footer{padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:6px}
.sb-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0}
.sb-uname{font-size:11px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-logout{font-size:11px;color:var(--sub);background:none;border:none;cursor:pointer;font-family:inherit;flex-shrink:0}

/* ── Main ── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.page-header{padding:16px 24px 12px;border-bottom:1px solid var(--border);background:var(--white);position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px}
.page-title{font-size:18px;font-weight:900;flex:1}
.page-body{padding:20px 24px;flex:1}

/* ── Stat cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:12px;padding:14px 16px;border:1px solid var(--border)}
.stat-num{font-size:26px;font-weight:900;line-height:1}
.stat-label{font-size:11px;color:var(--sub);margin-top:3px}

/* ── Toolbar ── */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search-input{padding:7px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;min-width:180px;background:var(--white)}
.search-input:focus{border-color:var(--pb)}
.filter-sel{padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--white);cursor:pointer}
.filter-sel:focus{border-color:var(--pb)}
.result-count{font-size:12px;color:var(--sub);margin-left:auto}

/* ── スポット一覧（場所＋紐付けまとめ） ── */
.spot-row{background:var(--white);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.spot-row-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .1s}
.spot-row-header:hover{background:var(--hover)}
.spot-cat-emoji{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.spot-info{flex:1;min-width:0}
.spot-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot-meta{font-size:11px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cp-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
.spot-toggle{font-size:12px;color:var(--sub);flex-shrink:0;transition:transform .2s;display:flex;align-items:center;gap:4px}
.spot-toggle.open{transform:rotate(180deg)}
.spot-actions{display:flex;gap:6px;flex-shrink:0}

/* ── 展開エリア ── */
.spot-detail{display:none;border-top:1px solid var(--border);padding:14px;background:var(--bg)}
.spot-detail.open{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.detail-section-title{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.07em;margin-bottom:8px}
.app-chip{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px;position:relative}
.app-chip-head{font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.app-chip-sub{color:var(--sub);font-size:11px}
.app-chip-actions{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.inline-form{background:var(--white);border:1.5px dashed var(--border);border-radius:8px;padding:10px 12px;margin-top:8px}
.inline-form-title{font-size:11px;font-weight:700;color:var(--purple);margin-bottom:8px}
.inline-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.inline-input{width:100%;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;outline:none;background:var(--white)}
.inline-input:focus{border-color:var(--pb)}
.inline-select{width:100%;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;outline:none;background:var(--white)}

/* ── Badges ── */
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px}
.badge-pub{background:#D1FAE5;color:var(--green)}
.badge-pend{background:#FEF3C7;color:var(--amber)}
.badge-rej{background:#FEE2E2;color:var(--red)}

/* ── Buttons ── */
.btn{padding:5px 11px;border-radius:7px;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;transition:opacity .1s;line-height:1.4}
.btn:active{opacity:.75}
.btn-edit{background:#EFF6FF;color:var(--blue)}
.btn-del{background:#FEE2E2;color:var(--red)}
.btn-approve{background:#D1FAE5;color:var(--green)}
.btn-pub{background:#D1FAE5;color:var(--green)}
.btn-primary{background:linear-gradient(135deg,var(--pb),var(--purple));color:white;padding:8px 18px;font-size:13px;border-radius:9px}
.btn-sm{padding:3px 8px;font-size:11px}

/* ── Form panel ── */
.form-panel{background:var(--white);border-radius:12px;border:1px solid var(--border);padding:18px 22px;max-width:700px}
.form-section{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.07em;margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--border)}
.form-section:first-child{margin-top:0;padding-top:0;border-top:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid.three{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:3px}
.form-label{font-size:11px;font-weight:700;color:#555}
.req{color:var(--red)}
.form-input,.form-select{padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--white);transition:border .15s;width:100%}
.form-input:focus,.form-select:focus{border-color:var(--pb)}
.form-hint{font-size:10px;color:var(--sub);margin-top:1px}
.form-msg{font-size:12px;text-align:center;min-height:16px;margin:6px 0}

/* ── Master cards ── */
.master-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.master-card{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;transition:border-color .1s}
.master-card:hover{border-color:var(--pb)}
.master-card-body{flex:1;min-width:0}
.master-card-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.master-card-meta{font-size:10px;color:var(--sub);margin-top:2px;font-family:monospace}
.color-swatch{width:26px;height:26px;border-radius:50%;border:2px solid rgba(0,0,0,.08);flex-shrink:0}
.emoji-lg{font-size:24px;flex-shrink:0;width:30px;text-align:center}

/* ── Master inline list ── */
.master-table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.master-table th{text-align:left;padding:8px 14px;background:#F9FAFB;font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.08em;border-bottom:1px solid var(--border)}
.master-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
.master-table tr:last-child td{border-bottom:none}
.master-table tr.editing td{background:#FAF5FF}
.add-form-row{background:white;border:1.5px dashed var(--pb);border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.add-form-row .form-group{margin:0}
.mini-input{padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;outline:none;background:white}
.mini-input:focus{border-color:var(--pb)}
.color-picker-wrap{display:flex;gap:6px;align-items:center}
.color-picker-wrap input[type=color]{width:36px;height:32px;border:none;border-radius:7px;cursor:pointer;padding:2px}

/* ── Pending card ── */
.pending-card{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.modal-box{background:var(--white);border-radius:14px;padding:22px 26px;width:440px;max-height:80vh;overflow-y:auto;animation:scaleIn .2s cubic-bezier(.22,1,.36,1)}
.modal-title{font-size:15px;font-weight:900;margin-bottom:14px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<div id="auth-gate">
  <div style="font-size:44px">🌸</div>
  <div style="font-size:20px;font-weight:900">Thai Series Map 管理者画面</div>
  <div style="font-size:13px;color:var(--sub)">管理者アカウントでログインしてください</div>
  <button class="g-btn" onclick="doLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">Googleでログイン
  </button>
</div>

<div id="admin-wrap">
  <nav class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-title">🌸 Thai Series Map</div>
      <div class="sb-logo-sub">管理者画面</div>
    </div>
    <div class="sb-nav">
      <div class="sb-section">メイン</div>
      <button class="sb-item active" onclick="showPage('dashboard')" id="nav-dashboard"><span class="icon">📊</span>ダッシュボード</button>
      <button class="sb-item" onclick="showPage('pending')" id="nav-pending"><span class="icon">📬</span>承認待ち<span class="sb-badge" id="pending-badge" style="display:none">0</span></button>
      <div class="sb-section">データ管理</div>
      <button class="sb-item" onclick="showPage('spots')" id="nav-spots"><span class="icon">📍</span>スポット一覧</button>
      <button class="sb-item" onclick="showPage('add')" id="nav-add"><span class="icon">➕</span>新規追加</button>
      <div class="sb-section">マスタ設定</div>
      <button class="sb-item" onclick="showPage('cp')" id="nav-cp"><span class="icon">💗</span>CP管理</button>
      <button class="sb-item" onclick="showPage('talent')" id="nav-talent"><span class="icon">🧑</span>タレント管理</button>
      <button class="sb-item" onclick="showPage('migrate')" id="nav-migrate"><span class="icon">🔄</span>CP→タレント移行</button>
      <button class="sb-item" onclick="showPage('series')" id="nav-series"><span class="icon">🎬</span>作品設定</button>
      <button class="sb-item" onclick="showPage('category')" id="nav-category"><span class="icon">📂</span>カテゴリー</button>
    </div>
    <div class="sb-footer">
      <img class="sb-avatar" id="sb-avatar" src="" alt="">
      <div class="sb-uname" id="sb-uname"></div>
      <button class="sb-logout" onclick="doLogout()">ログアウト</button>
    </div>
  </nav>

  <div class="main">
    <div class="page-header">
      <div class="page-title" id="page-title">ダッシュボード</div>
      <a href="index.html" style="font-size:12px;color:var(--purple);text-decoration:none;font-weight:700;flex-shrink:0">← 地図に戻る</a>
    </div>
    <div class="page-body" id="page-body">
      <div style="text-align:center;color:var(--sub);padding:40px">読み込み中...</div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, addDoc, setDoc, updateDoc, deleteDoc, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB={apiKey:"AIzaSyARPFANz5DZa6KpEBiw77PCCYPPZghMGeg",authDomain:"thai-gl-works-2c835.firebaseapp.com",databaseURL:"https://thai-gl-works-2c835-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"thai-gl-works-2c835",storageBucket:"thai-gl-works-2c835.firebasestorage.app",messagingSenderId:"71290080508",appId:"1:71290080508:web:47de06018b8617225bdb79"};
const app=initializeApp(FB), auth=getAuth(app), db=getFirestore(app), prov=new GoogleAuthProvider();
const ADMIN="cory92059@gmail.com";

let LOCS=[],APPS=[],SUBS=[],CP_M=[],SERIES_M=[],CAT_M=[],TALENT_M=[];
let currentPage='dashboard';

// ── Auth ──────────────────────────────────────────────────────
window.doLogin=async()=>{try{await signInWithPopup(auth,prov);}catch(e){if(['auth/popup-blocked','auth/popup-closed-by-user'].includes(e.code)){await signInWithRedirect(auth,prov);}else alert('ログイン失敗: '+e.message);}};
window.doLogout=()=>signOut(auth);
getRedirectResult(auth).catch(()=>{});
onAuthStateChanged(auth,async user=>{
  if(user&&user.email===ADMIN){
    document.getElementById('auth-gate').style.display='none';
    document.getElementById('admin-wrap').style.display='flex';
    document.getElementById('sb-avatar').src=user.photoURL||'';
    document.getElementById('sb-uname').textContent=user.displayName||user.email;
    await loadAll(); showPage('dashboard');
  } else if(user){
    document.getElementById('auth-gate').innerHTML='<div style="font-size:40px">🚫</div><div style="font-weight:900;margin:8px">管理者専用です</div><button class="g-btn" onclick="doLogout()" style="margin-top:8px">ログアウト</button>';
  } else {
    document.getElementById('auth-gate').style.display='flex';
    document.getElementById('admin-wrap').style.display='none';
  }
});

// ── Data ──────────────────────────────────────────────────────
// ── キャッシュ設定（admin用・短め）──────────────────────────
const ADMIN_CACHE_TTL = 5*60*1000; // 5分
const CACHE_KEYS={locs:'adm_loc',apps:'adm_app',subs:'adm_sub',cp:'adm_cp',series:'adm_series',cat:'adm_cat',talent:'adm_talent'};
const saveAC=(k,d)=>{try{sessionStorage.setItem(k,JSON.stringify({ts:Date.now(),data:d}));}catch(e){}};
const loadAC=(k)=>{try{const r=sessionStorage.getItem(k);if(!r)return null;const{ts,data}=JSON.parse(r);if(Date.now()-ts>ADMIN_CACHE_TTL){sessionStorage.removeItem(k);return null;}return data;}catch(e){return null;}};
function clearAdminCache(){Object.values(CACHE_KEYS).forEach(k=>sessionStorage.removeItem(k));}

async function loadAll(forceRefresh=false){
  const cl=!forceRefresh&&loadAC(CACHE_KEYS.locs);
  const ca_=!forceRefresh&&loadAC(CACHE_KEYS.apps);
  const cs=!forceRefresh&&loadAC(CACHE_KEYS.subs);
  const cc=!forceRefresh&&loadAC(CACHE_KEYS.cp);
  const csm=!forceRefresh&&loadAC(CACHE_KEYS.series);
  const ccat=!forceRefresh&&loadAC(CACHE_KEYS.cat);
  const ct=!forceRefresh&&loadAC(CACHE_KEYS.talent);

  const fetches=[];
  if(!cl)fetches.push(getDocs(collection(db,'locations')));
  else fetches.push(null);
  if(!ca_)fetches.push(getDocs(collection(db,'appearances')));
  else fetches.push(null);
  if(!cs)fetches.push(getDocs(collection(db,'location_submissions')));
  else fetches.push(null);
  if(!cc)fetches.push(getDocs(collection(db,'cp_master')).catch(()=>({docs:[]})));
  else fetches.push(null);
  if(!csm)fetches.push(getDocs(collection(db,'series_master')).catch(()=>({docs:[]})));
  else fetches.push(null);
  if(!ccat)fetches.push(getDocs(collection(db,'category_master')).catch(()=>({docs:[]})));
  else fetches.push(null);
  if(!ct)fetches.push(getDocs(collection(db,'talent_master')).catch(()=>({docs:[]})));
  else fetches.push(null);

  const results=await Promise.all(fetches.map(f=>f||Promise.resolve(null)));
  LOCS=results[0]?results[0].docs.map(d=>({id:d.id,...d.data()})):cl;
  APPS=results[1]?results[1].docs.map(d=>({id:d.id,...d.data()})):ca_;
  SUBS=results[2]?results[2].docs.map(d=>({id:d.id,...d.data()})):cs;
  CP_M=results[3]?results[3].docs.map(d=>({id:d.id,...d.data()})):cc;
  SERIES_M=results[4]?results[4].docs.map(d=>({id:d.id,...d.data()})):csm;
  CAT_M=results[5]?results[5].docs.map(d=>({id:d.id,...d.data()})):ccat;
  TALENT_M=results[6]?results[6].docs.map(d=>({id:d.id,...d.data()})):ct;

  if(results[0])saveAC(CACHE_KEYS.locs,LOCS);
  if(results[1])saveAC(CACHE_KEYS.apps,APPS);
  if(results[2])saveAC(CACHE_KEYS.subs,SUBS);
  if(results[3])saveAC(CACHE_KEYS.cp,CP_M);
  if(results[4])saveAC(CACHE_KEYS.series,SERIES_M);
  if(results[5])saveAC(CACHE_KEYS.cat,CAT_M);
  if(results[6])saveAC(CACHE_KEYS.talent,TALENT_M);

  const n=SUBS.filter(s=>s.status==='未承認').length;
  const badge=document.getElementById('pending-badge');
  if(badge){badge.style.display=n?'inline':'none';badge.textContent=n;}
}

// ── ローカルデータ更新（Firestore再取得なし）───────────────────
function localUpdateLoc(id,data){
  const idx=LOCS.findIndex(l=>l.id===id);
  if(idx>=0)LOCS[idx]={...LOCS[idx],...data};
  saveAC(CACHE_KEYS.locs,LOCS);
}
function localAddLoc(id,data){LOCS.push({id,...data});saveAC(CACHE_KEYS.locs,LOCS);}
function localDeleteLoc(id){LOCS=LOCS.filter(l=>l.id!==id);saveAC(CACHE_KEYS.locs,LOCS);}
function localUpdateApp(id,data){const idx=APPS.findIndex(a=>a.id===id);if(idx>=0)APPS[idx]={...APPS[idx],...data};saveAC(CACHE_KEYS.apps,APPS);}
function localAddApp(id,data){APPS.push({id,...data});saveAC(CACHE_KEYS.apps,APPS);}
function localDeleteApp(id){APPS=APPS.filter(a=>a.id!==id);saveAC(CACHE_KEYS.apps,APPS);}
function localUpdateSub(id,data){const idx=SUBS.findIndex(s=>s.id===id);if(idx>=0)SUBS[idx]={...SUBS[idx],...data};saveAC(CACHE_KEYS.subs,SUBS);}
function localUpdateCp(id,data){const idx=CP_M.findIndex(m=>m.id===id);if(idx>=0)CP_M[idx]={...CP_M[idx],...data};saveAC(CACHE_KEYS.cp,CP_M);}
function localAddTalent(id,data){TALENT_M.push({id,...data});saveAC(CACHE_KEYS.talent,TALENT_M);}

// ── Navigation ─────────────────────────────────────────────────
const PAGE_TITLES={dashboard:'📊 ダッシュボード',pending:'📬 承認待ち',spots:'📍 スポット一覧',add:'➕ 新規追加',cp:'💗 CP管理',talent:'🧑 タレント管理',migrate:'🔄 CP→タレント移行',series:'🎬 作品設定',category:'📂 カテゴリー'};
window.showPage=function(name){
  currentPage=name;
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+name)?.classList.add('active');
  document.getElementById('page-title').textContent=PAGE_TITLES[name]||name;
  ({dashboard:window.renderDashboard,pending:window.renderPending,spots:window.renderSpots,add:window.renderAdd,cp:window.renderCp,talent:window.renderTalent,migrate:window.renderMigrate,series:window.renderSeries,category:window.renderCategory}[name]||(() => {}))();
};
function setBody(html){document.getElementById('page-body').innerHTML=html;}

// ── Dashboard ──────────────────────────────────────────────────
window.renderDashboard=function(){
  const pending=SUBS.filter(s=>s.status==='未承認');
  const pubApps=APPS.filter(a=>a.status==='公開');
  const cps=[...new Set(APPS.map(a=>a.cp).filter(Boolean))];
  let html=`<div class="stat-grid">
    <div class="stat-card"><div class="stat-num">${LOCS.length}</div><div class="stat-label">📍 スポット数</div></div>
    <div class="stat-card"><div class="stat-num">${pubApps.length}</div><div class="stat-label">🎬 公開紐付け</div></div>
    <div class="stat-card" style="${pending.length?'border-color:var(--pink)':''}"><div class="stat-num" style="${pending.length?'color:var(--pink)':''}">${pending.length}</div><div class="stat-label">📬 承認待ち</div></div>
    <div class="stat-card"><div class="stat-num">${CP_M.length||cps.length}</div><div class="stat-label">💗 CP数</div></div>
  </div>`;
  // CP別件数
  const cpList=CP_M.length?CP_M:cps.map(c=>({name:c,color:'#888',emoji:'💗'}));
  html+=`<div class="stat-grid">`+cpList.map(cp=>{
    const cnt=pubApps.filter(a=>a.cp===cp.name).length;
    return`<div class="stat-card"><div class="stat-num" style="color:${cp.color||'#888'}">${cnt}</div><div class="stat-label">${cp.emoji||'💗'} ${cp.name}</div></div>`;
  }).join('')+'</div>';
  if(pending.length){
    html+=`<div style="font-size:13px;font-weight:700;color:var(--pink);margin:16px 0 8px">⚡ 承認待ちの投稿</div>`;
    html+=pending.slice(0,3).map(s=>pendingCardHTML(s)).join('');
    if(pending.length>3)html+=`<button class="btn btn-edit" onclick="showPage('pending')" style="margin-top:4px">すべて見る (${pending.length}件) →</button>`;
  }
  setBody(html);
};

// ── Pending ────────────────────────────────────────────────────
window.renderPending=function(){
  const list=SUBS.filter(s=>s.status==='未承認');
  setBody(list.length?list.map(s=>pendingCardHTML(s)).join(''):'<div style="text-align:center;color:var(--sub);padding:60px">承認待ちの投稿はありません 🎉</div>');
};
function pendingCardHTML(s){
  return`<div class="pending-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div><div style="font-size:14px;font-weight:700;margin-bottom:3px">${s.name}</div>
        <div style="font-size:12px;color:var(--sub);line-height:1.7">${s.cp||''} / ${s.series||''}<br>${s.scene_desc||''}${s.memo?'<br>💡 '+s.memo:''}</div>
        <div style="font-size:10px;color:#bbb;margin-top:4px">投稿: ${s.submittedBy||'不明'}</div></div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="btn btn-approve" onclick="approveSub('${s.id}')">✅ 承認</button>
        <button class="btn btn-del" onclick="rejectSub('${s.id}')">✕ 却下</button>
      </div>

  </div>`;

window.approveSub=async function(id){
  const s=SUBS.find(x=>x.id===id);
  if(!s||!confirm('「'+s.name+'」を承認しますか？'))return;
  try{
    const ref=doc(collection(db,'locations'));
    await setDoc(ref,{name:s.name,lat:s.lat||0,lng:s.lng||0,category:s.category||'観光地',address:s.address||'',googleMapsUrl:s.googleMapsUrl||'',memo:s.memo||''});
    await addDoc(collection(db,'appearances'),{location_id:ref.id,cp:s.cp||'',series:s.series||'',scene_desc:s.scene_desc||'',sns_url:s.sns_url||'',status:'公開'});
    await updateDoc(doc(db,'location_submissions',id),{status:'承認済み'});
    clearC(); await loadAll(); showPage(currentPage);
  }catch(e){alert('エラー: '+e.message);}
};
window.rejectSub=async function(id){
  if(!confirm('却下しますか？'))return;
  await updateDoc(doc(db,'location_submissions',id),{status:'却下'});
  await loadAll(); showPage(currentPage);
};

// ── Spots（場所＋紐付けまとめ） ─────────────────────────────────
window.renderSpots=function(){
  const fQ=(document.getElementById('fQ')?.value||'').toLowerCase();
  const fCat=document.getElementById('fCat')?.value||'';
  const fCp=document.getElementById('fCp')?.value||'';
  const fSeries=document.getElementById('fSeries')?.value||'';
  const fStatus=document.getElementById('fStatus')?.value||'';
  const allCats=[...new Set(LOCS.map(l=>l.category).filter(Boolean))].sort();
  const allCps=[...new Set([...APPS.map(a=>a.cp),...CP_M.map(m=>m.name)].filter(Boolean))].sort();
  const allSeries=[...new Set([...APPS.map(a=>a.series),...SERIES_M.map(m=>m.name)].filter(Boolean))].sort();

  const filtered=LOCS.filter(loc=>{
    if(fQ&&!loc.name.toLowerCase().includes(fQ))return false;
    if(fCat&&loc.category!==fCat)return false;
    const apps=APPS.filter(a=>a.location_id===loc.id);
    if(fCp&&!apps.some(a=>{const t=appTalent(a);return t&&talentKey(t)===fCp;}))return false;
    if(fSeries&&!apps.some(a=>a.series===fSeries))return false;
    if(fStatus&&!apps.some(a=>a.status===fStatus))return false;
    return true;
  });

  let html=`<div class="toolbar">
    <input class="search-input" id="fQ" placeholder="🔍 場所名で検索..." oninput="renderSpots()" value="${esc(fQ)}">
    <select class="filter-sel" id="fCat" onchange="renderSpots()">
      <option value="">カテゴリー</option>${allCats.map(c=>`<option value="${c}"${fCat===c?' selected':''}>${c}</option>`).join('')}
    </select>
    <select class="filter-sel" id="fCp" onchange="renderSpots()">
      <option value="">タレント</option>${[...TALENT_M].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''))).map(m=>{const k=talentKey(m);const dup=TALENT_M.filter(x=>x.name===m.name).length>1;const lbl=dup&&m.real_name?`${m.name}（${m.real_name}）`:m.name;return `<option value="${esc(k)}"${fCp===k?' selected':''}>${esc(lbl)}</option>`;}).join('')}
    </select>
    <select class="filter-sel" id="fSeries" onchange="renderSpots()">
      <option value="">作品</option>${allSeries.map(s=>`<option value="${s}"${fSeries===s?' selected':''}>${s}</option>`).join('')}
    </select>
    <select class="filter-sel" id="fStatus" onchange="renderSpots()">
      <option value="">状態</option>
      <option value="公開"${fStatus==='公開'?' selected':''}>公開</option>
      <option value="未承認"${fStatus==='未承認'?' selected':''}>未承認</option>
    </select>
    <span class="result-count">${filtered.length}件</span>
    <button class="btn btn-primary" onclick="showPage('add')" style="margin-left:auto">➕ 新規追加</button>
  </div>`;

  if(!filtered.length){html+='<div style="text-align:center;color:var(--sub);padding:40px">該当するスポットがありません</div>';}
  else {
    html+=filtered.map(loc=>{
      const apps=APPS.filter(a=>a.location_id===loc.id);
      const cat=CAT_M.find(m=>m.name===loc.category);
      const catEmoji=cat?.emoji||getCatEmoji(loc.category);
      const cpChips=apps.filter((a,i,arr)=>arr.findIndex(x=>appWhoKey(x)===appWhoKey(a))===i).map(a=>appWhoChip(a)).join('');
      return`<div class="spot-row" id="row-${loc.id}">
        <div class="spot-row-header" onclick="toggleSpot('${loc.id}')">
          <div class="spot-cat-emoji">${catEmoji}</div>
          <div class="spot-info">
            <div class="spot-name">${loc.name}</div>
            <div class="spot-meta">
              <span style="color:var(--sub)">${loc.category||''}</span>
              ${cpChips}
              <span style="color:var(--sub)">${apps.length}件の紐付け</span>
            </div>
          </div>
          <div class="spot-actions" onclick="event.stopPropagation()">
            <button class="btn btn-edit btn-sm" onclick="editLocModal('${loc.id}')">✏ 編集</button>
            <button class="btn btn-del btn-sm" onclick="deleteLoc('${loc.id}')">🗑</button>
          </div>
          <div class="spot-toggle" id="toggle-${loc.id}">▼</div>
        </div>
        <div class="spot-detail" id="detail-${loc.id}"></div>
      </div>`;
    }).join('');
  }
  setBody(html);
};

window.toggleSpot=function(locId){
  const detail=document.getElementById('detail-'+locId);
  const toggle=document.getElementById('toggle-'+locId);
  const isOpen=detail.classList.contains('open');
  if(isOpen){detail.classList.remove('open');toggle.textContent='▼';}
  else{detail.classList.add('open');toggle.textContent='▲';renderSpotDetail(locId);}
};

function renderSpotDetail(locId){
  const loc=LOCS.find(l=>l.id===locId);
  const apps=APPS.filter(a=>a.location_id===locId);
  const allCps=[...new Set([...APPS.map(a=>a.cp),...CP_M.map(m=>m.name)].filter(Boolean))].sort();
  const allSeries=[...new Set([...APPS.map(a=>a.series),...SERIES_M.map(m=>m.name)].filter(Boolean))].sort();
  const detail=document.getElementById('detail-'+locId);

  const appCards=apps.map(a=>{
    const t=appTalent(a);
    const col=t?(t.color||'#888'):'#F59E0B';
    return`<div class="app-chip" style="border-left:3px solid ${col}">
      <div class="app-chip-head">
        ${appWhoChip(a)}
        <span style="color:var(--sub);font-weight:400">— ${a.series||'未設定'}</span>
        <span class="badge ${a.status==='公開'?'badge-pub':'badge-pend'}">${a.status}</span>
      </div>
      <div class="app-chip-sub">${a.scene_desc||''}</div>
      ${a.sns_url?`<a href="${a.sns_url}" target="_blank" style="font-size:10px;color:var(--blue)">SNS ↗</a>`:''}
      <div class="app-chip-actions">
        <button class="btn btn-edit btn-sm" onclick="editAppModal('${a.id}','${locId}')">✏</button>
        <button class="btn btn-del btn-sm" onclick="deleteApp('${a.id}','${locId}')">🗑</button>
        ${a.status!=='公開'?`<button class="btn btn-pub btn-sm" onclick="pubApp('${a.id}','${locId}')">▶</button>`:''}
      </div>
    </div>`;
  }).join('')||'<div style="font-size:12px;color:var(--sub);padding:4px 0">紐付けなし</div>';

  detail.innerHTML=`
    <div>
      <div class="detail-section-title">📍 場所情報</div>
      <div style="font-size:12px;line-height:1.9;color:var(--sub)">
        ${loc.address?'住所: '+loc.address+'<br>':''}
        座標: ${loc.lat}, ${loc.lng}<br>
        ${loc.memo?'💡 '+loc.memo+'<br>':''}
        ${loc.googleMapsUrl&&!loc.googleMapsUrl.includes('xxx')?`<a href="${loc.googleMapsUrl}" target="_blank" style="color:var(--blue);font-size:11px">Googleマップで開く ↗</a>`:''}
      </div>
    </div>
    <div>
      <div class="detail-section-title">🎬 紐付け (${apps.length}件)</div>
      ${appCards}
      <div class="inline-form">
        <div class="inline-form-title">＋ 紐付けを追加</div>
        <div class="inline-grid">
          <div><div class="form-label" style="font-size:10px;margin-bottom:3px">タレント</div>
            ${comboHtml('na-talent-'+locId,'talent','','タレント名で検索…')}</div>
          <div><div class="form-label" style="font-size:10px;margin-bottom:3px">中カテゴリ（作品名 / プライベート / 〇〇年来日）</div>
            ${comboHtml('na-series-'+locId,'series','','作品名で検索 / 自由入力')}</div>
          <div><div class="form-label" style="font-size:10px;margin-bottom:3px">シーン説明</div>
            <input class="inline-input" id="na-scene-${locId}" placeholder="どのシーンか"></div>
        </div>
        <input class="inline-input" id="na-sns-${locId}" placeholder="SNSリンク（任意）" style="width:100%;margin-bottom:8px">
        <div id="na-msg-${locId}" style="font-size:11px;min-height:14px;margin-bottom:4px;color:var(--green)"></div>
        <button class="btn btn-primary" style="padding:6px 14px;font-size:12px" onclick="addApp('${locId}')">＋ 追加</button>
      </div>
    </div>`;
}

window.addApp=async function(locId){
  const talentId=document.getElementById('na-talent-'+locId)?.value||'';
  const series=document.getElementById('na-series-'+locId)?.value.trim()||'';
  const scene=document.getElementById('na-scene-'+locId)?.value.trim()||'';
  const sns=document.getElementById('na-sns-'+locId)?.value.trim()||'';
  const msg=document.getElementById('na-msg-'+locId);
  const tm=TALENT_M.find(m=>talentKey(m)===talentId);const tname=tm?tm.name:'';
  msg.style.color='var(--purple)';msg.textContent='追加中...';
  try{
    const data={location_id:locId,talent_id:talentId,talent:tname,cp:tname,series,scene_desc:scene,sns_url:sns,status:'公開'};
    const ref=await addDoc(collection(db,'appearances'),data);
    msg.style.color='var(--green)';msg.textContent='✅ 追加しました';
    clearC();
    localAddApp(ref.id,data);
    setTimeout(()=>renderSpotDetail(locId),200);
  }catch(e){msg.style.color='var(--red)';msg.textContent='エラー: '+e.message;}
};

// 編集モーダルの座標ステータスをリアルタイム更新
window.updateEditCoordStatus=function(){
  const lat=parseFloat(document.getElementById('el-lat')?.value);
  const lng=parseFloat(document.getElementById('el-lng')?.value);
  const el=document.getElementById('el-coord-status');
  if(!el)return;
  if(lat&&lng&&!isNaN(lat)&&!isNaN(lng)){
    el.innerHTML=`<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green);background:#D1FAE5;border-radius:7px;padding:5px 10px">
      <span>✅ 座標: ${lat}, ${lng}</span>
      <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" target="_blank"
        style="color:var(--blue);font-weight:700;text-decoration:none;margin-left:auto">地図で確認 ↗</a>
    </div>`;
  } else {
    el.innerHTML=`<div style="font-size:11px;color:var(--amber);background:#FEF3C7;border-radius:7px;padding:5px 10px">⚠ 座標が未設定です</div>`;
  }
};
window.saveLoc=async function(locId){
  const msg=document.getElementById('el-msg');
  msg.style.color='var(--purple)';msg.textContent='保存中...';
  try{
    const gmap=document.getElementById('el-gmap').value.trim();
    const url=document.getElementById('el-url').value.trim();
    await updateDoc(doc(db,'locations',locId),{
      name:document.getElementById('el-name').value.trim(),
      lat:parseFloat(document.getElementById('el-lat').value)||0,
      lng:parseFloat(document.getElementById('el-lng').value)||0,
      category:document.getElementById('el-cat').value,
      address:document.getElementById('el-address').value.trim(),
      googleMapsUrl:url||gmap,
      memo:document.getElementById('el-memo').value.trim(),
    });
    msg.style.color='var(--green)';msg.textContent='✅ 保存しました';
    localUpdateLoc(locId,{name:document.getElementById('el-name').value.trim(),lat:parseFloat(document.getElementById('el-lat').value)||0,lng:parseFloat(document.getElementById('el-lng').value)||0,category:document.getElementById('el-cat').value,address:document.getElementById('el-address').value.trim(),googleMapsUrl:document.getElementById('el-url').value.trim()||document.getElementById('el-gmap').value.trim(),memo:document.getElementById('el-memo').value.trim()});
    clearC(); setTimeout(closeModal,1000); renderSpots();

window.addAppBlock=function(){

// 新規CP名に割り当てる色（手で選ばなくてよいよう名前から自動決定）
const CP_PALETTE=['#EC4899','#9333EA','#3B82F6','#059669','#D97706','#DC2626','#0891B2','#7C3AED','#DB2777','#16A34A','#EA580C','#2563EB'];
function autoCpColor(name){let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return CP_PALETTE[h%CP_PALETTE.length];}
// タレントの安定キー（名鑑ID優先、無ければtalent_master doc id）
function talentKey(m){return m.src_id||m.id;}
function talentOptionsHtml(selectedKey){
  const seen=new Set(),dup=new Set();
  TALENT_M.forEach(m=>{if(seen.has(m.name))dup.add(m.name);seen.add(m.name);});
  const opts=[...TALENT_M].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')))
    .map(m=>{const k=talentKey(m);const lbl=(dup.has(m.name)&&m.real_name)?`${m.name}（${m.real_name}）`:m.name;
      return `<option value="${esc(k)}"${k===selectedKey?' selected':''}>${esc(lbl)}</option>`;}).join('');
  return `<option value="">（タレントを選択）</option>`+opts;
}
// appearanceから登録タレントを解決（talent_id優先→名前）。無ければnull
function appTalent(a){
  if(a&&a.talent_id){const m=TALENT_M.find(x=>talentKey(x)===a.talent_id);if(m)return m;}
  if(a&&a.talent){const m=TALENT_M.find(x=>x.name===a.talent);if(m)return m;}
  return null;
}
function appWhoKey(a){const t=appTalent(a);return t?talentKey(t):('legacy:'+(a.talent||a.cp||''));}
function appWhoChip(a){
  const t=appTalent(a);
  if(t){
    const dup=TALENT_M.filter(x=>x.name===t.name).length>1;
    const lbl=dup&&t.real_name?`${t.name}（${t.real_name}）`:t.name;
    const c=t.color||'#888';
    return `<span class="cp-chip" style="background:${c}22;color:${c};border:1px solid ${c}66">${t.emoji||'⭐'} ${esc(lbl)}</span>`;
  }
  const legacy=a.talent||a.cp||'';
  return `<span class="cp-chip" style="background:#FEF3C7;color:#92400E;border:1px solid #F59E0B">⚠ ${esc(legacy||'タレント未設定')}</span>`;
}

// ── 検索できるコンボボックス（talent=選択式 / series=自由入力可）─────
function talentLabelByKey(key){
  if(!key)return '';
  const m=TALENT_M.find(x=>talentKey(x)===key); if(!m)return '';
  const dup=TALENT_M.filter(x=>x.name===m.name).length>1;
  return dup&&m.real_name?`${m.name}（${m.real_name}）`:m.name;
}
function comboHtml(idBase,type,value,placeholder){
  const display=type==='talent'?talentLabelByKey(value):(value||'');
  const inputId=type==='talent'?idBase+'__q':idBase;
  return `<div style="position:relative">
    ${type==='talent'?`<input type="hidden" id="${idBase}" value="${esc(value||'')}">`:''}
    <input class="form-input" id="${inputId}" autocomplete="off" placeholder="${esc(placeholder||'検索して選択…')}" value="${esc(display)}"
      oninput="comboFilter('${idBase}','${type}')" onfocus="comboFilter('${idBase}','${type}')" onblur="comboBlur('${idBase}','${type}')">
    <div id="${idBase}__list" style="display:none;position:absolute;z-index:60;left:0;right:0;max-height:220px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);margin-top:2px"></div>
  </div>`;
}
function comboItems(type,q){
  q=(q||'').toLowerCase().trim();
  if(type==='talent'){
    const dn={}; TALENT_M.forEach(m=>{dn[m.name]=(dn[m.name]||0)+1;});
    return [...TALENT_M].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')))
      .filter(m=>!q||String(m.name||'').toLowerCase().includes(q)||String(m.real_name||'').toLowerCase().includes(q))
      .map(m=>({key:talentKey(m),label:dn[m.name]>1&&m.real_name?`${m.name}（${m.real_name}）`:m.name})).slice(0,80);
  }
  const all=[...new Set([...APPS.map(a=>a.series),...SERIES_M.map(m=>m.name)].filter(Boolean))].sort();
  return all.filter(s=>!q||s.toLowerCase().includes(q)).map(s=>({key:s,label:s})).slice(0,80);
}
window.comboFilter=function(idBase,type){
  const qEl=document.getElementById(type==='talent'?idBase+'__q':idBase);
  const list=document.getElementById(idBase+'__list');
  if(!qEl||!list)return;
  const items=comboItems(type,qEl.value);
  const rows=items.map(it=>`<div onmousedown="comboPick('${idBase}','${type}',this.dataset.k,this.dataset.l)" data-k="${esc(it.key)}" data-l="${esc(it.label)}" style="padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #f1f1f1" onmouseover="this.style.background='#f3f0ff'" onmouseout="this.style.background='#fff'">${esc(it.label)}</div>`).join('');
  const clearRow=type==='talent'?`<div onmousedown="comboPick('${idBase}','talent','','')" style="padding:6px 10px;cursor:pointer;font-size:12px;color:var(--sub)">（選択をクリア）</div>`:'';
  list.innerHTML=clearRow+(rows||`<div style="padding:8px 10px;font-size:12px;color:var(--sub)">該当なし${type==='series'?'（このまま入力で新規作品）':''}</div>`);
  list.style.display='block';
  if(type==='series'&&idBase.startsWith('a-series-'))saveDraft();
};
window.comboPick=function(idBase,type,key,label){
  if(type==='talent'){
    const hid=document.getElementById(idBase);if(hid)hid.value=key;
    const q=document.getElementById(idBase+'__q');if(q)q.value=label;
  }else{
    const el=document.getElementById(idBase);if(el)el.value=key;
  }
  const list=document.getElementById(idBase+'__list');if(list)list.style.display='none';
  if(idBase.startsWith('a-talent-')||idBase.startsWith('a-series-'))saveDraft();
  if(idBase.startsWith('a-series-'))refreshTalentCandidates(idBase.slice('a-series-'.length));
};
// 作品を選ぶと、その作品に紐付くタレントを候補チップとして表示（タップで選択）
window.refreshTalentCandidates=function(i){
  const box=document.getElementById('a-talent-cand-'+i); if(!box)return;
  const seriesVal=(document.getElementById('a-series-'+i)?.value||'').trim();
  const s=seriesByName(seriesVal);
  const keys=(s?seriesTalentKeys(s):[]).filter(k=>talentByKey(k));
  if(!keys.length){box.style.display='none';box.innerHTML='';return;}
  // タレント欄が空で候補が1人だけなら自動入力
  const hid=document.getElementById('a-talent-'+i);
  if(hid&&!hid.value&&keys.length===1){comboPick('a-talent-'+i,'talent',keys[0],talentLabelByKey(keys[0]));}
  box.style.display='block';
  box.innerHTML=`<div style="font-size:10px;color:var(--sub);margin-bottom:3px">💡 ${esc(seriesVal)} の出演タレント（タップで選択）</div>`+
    keys.map(k=>{const m=talentByKey(k);const c=m.color||'#888';
      return `<button type="button" onclick="comboPick('a-talent-${i}','talent','${esc(k)}','${esc(talentLabelByKey(k))}')" style="background:${c}1a;color:${c};border:1px solid ${c}55;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700;margin:0 4px 4px 0;cursor:pointer">${m.emoji||'⭐'} ${esc(m.name)}</button>`;}).join('');
};
window.comboBlur=function(idBase,type){
  setTimeout(()=>{
    const list=document.getElementById(idBase+'__list');if(list)list.style.display='none';
    if(type==='talent'){
      const q=document.getElementById(idBase+'__q'),hid=document.getElementById(idBase);
      if(q&&hid)q.value=talentLabelByKey(hid.value); // 表示を実際の選択に同期
    }
  },180);
};

// ── 移行（CP→タレント 自動分割）─────────────────────────────
function splitCpToTalents(cp){
  const byName={}; TALENT_M.forEach(m=>{const k=String(m.name||'').toLowerCase();if(k)(byName[k]=byName[k]||[]).push(m);});
  const s=String(cp||'').replace(/\s+/g,'');
  if(!s)return null;
  const n=s.length, dp=Array(n+1).fill(null); dp[0]=[];
  for(let i=1;i<=n;i++){
    for(let j=0;j<i;j++){
      if(dp[j]){
        const seg=s.slice(j,i).toLowerCase();
        if(byName[seg]&&(!dp[i]||dp[i].length>dp[j].length+1))dp[i]=[...dp[j],byName[seg][0]];
      }
    }
  }
  return dp[n];
}
function legacyApps(){return APPS.filter(a=>!a.talent_id&&(a.cp||a.talent));}

// ── 作品⇄タレント 紐付け（正データは series_master.talents[]。逆引きは派生）──
function seriesTalentKeys(series){return Array.isArray(series&&series.talents)?series.talents:[];}
function seriesByName(name){return SERIES_M.find(s=>s.name===name)||null;}
function talentByKey(key){return TALENT_M.find(x=>talentKey(x)===key)||null;}
// タレント→出演作品（series_master側を逆引き）
function talentSeriesNames(m){const k=talentKey(m);return SERIES_M.filter(s=>seriesTalentKeys(s).includes(k)).map(s=>s.name);}
// タレントチップ（紐付け表示用）
function talentChipHtml(key,removable,onRemoveJs){
  const m=talentByKey(key);
  const dup=m?TALENT_M.filter(x=>x.name===m.name).length>1:false;
  const name=m?((dup&&m.real_name)?`${m.name}（${m.real_name}）`:m.name):key;
  const c=(m&&m.color)||'#888';
  return `<span style="background:${c}1a;color:${c};border:1px solid ${c}55;border-radius:12px;padding:2px 8px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;margin:2px 3px 2px 0">${(m&&m.emoji)||'⭐'} ${esc(name)}${removable?` <span style="cursor:pointer;font-weight:900" onclick="${onRemoveJs}">✕</span>`:''}</span>`;
}
// 作品チップ（タレント側の出演作品表示用）
function seriesChipHtml(name){
  const s=seriesByName(name); const c=(s&&s.color)||'#9333EA';
  return `<span style="background:${c}14;color:${c};border:1px solid ${c}44;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;margin:2px 3px 2px 0;display:inline-block">🎬 ${esc(name)}</span>`;
}
function downloadJson(obj,fname){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

window.doMigrate=async function(){
  const targets=legacyApps().map(a=>({a,split:splitCpToTalents(a.cp||a.talent||'')})).filter(x=>x.split&&x.split.length);
  if(!targets.length){alert('自動変換できる対象がありません');return;}
  if(!confirm(`自動分割を実行します（${targets.length}件を変換）。\nバックアップは取りましたか？ よろしければOKを押してください。`))return;
  try{
    for(const {a,split} of targets){
      const t0=split[0];
      const u={talent_id:talentKey(t0),talent:t0.name,cp:t0.name};
      await updateDoc(doc(db,'appearances',a.id),u);
      localUpdateApp(a.id,u);
      for(let i=1;i<split.length;i++){
        const t=split[i];
        const data={location_id:a.location_id,talent_id:talentKey(t),talent:t.name,cp:t.name,series:a.series||'',scene_desc:a.scene_desc||'',sns_url:a.sns_url||'',status:a.status||'公開'};
        const ref=await addDoc(collection(db,'appearances'),data);
        localAddApp(ref.id,data);
      }
    }
    clearC(); renderMigrate();
    alert('変換が完了しました。残った「⚠ 手動」分は、スポット一覧で個別に直してください。');
  }catch(e){alert('エラー: '+e.message);}
};

      const tname=tm?tm.name:'';
      const appData={location_id:ref.id,talent_id:a.talentId,talent:tname,

    clearDraft();clearC();
    renderAdd();

let _talentDir=null,_talentFields=[],_talentNameField='name';
function isNameLike(v){
  if(typeof v!=='string')return false;
  const s=v.trim();
  if(!s||s.length>40)return false;
  if(/^https?:/i.test(s))return false;            // URL除外
  if(/^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}$/.test(s))return false; // 日付除外
  if(/^[\d\s./-]+$/.test(s))return false;          // 数字のみ除外
  return /[A-Za-z\u3040-\u30ff\u4e00-\u9fff]/.test(s);
}
const NAME_PRIORITY=['nickname','name','name_en','stage_name','real_name','displayName','nickname_kana'];
function bestNameField(fields,dir){
  // 優先フィールドが存在し、名前らしい値があれば最優先
  for(const p of NAME_PRIORITY){
    if(fields.includes(p)&&dir.some(t=>isNameLike(t.raw?.[p])))return p;
  }
  // フォールバック: 名前らしい値が最も多いフィールド
  let best=fields[0]||'name',bestScore=-1;
  for(const f of fields){
    let s=0; for(const t of dir){if(isNameLike(t.raw?.[f]))s++;}
    if(/name/i.test(f))s+=0.5;
    if(s>bestScore){bestScore=s;best=f;}
  }
  return best;
}

window.dedupeTalents=async function(){
  const groups={};
  TALENT_M.forEach(m=>{const k=(m.name||'')+'|'+(m.real_name||'');(groups[k]=groups[k]||[]).push(m);});
  const dups=Object.values(groups).filter(g=>g.length>1);
  if(!dups.length){alert('重複は見つかりませんでした');return;}
  const delCount=dups.reduce((s,g)=>s+g.length-1,0);
  if(!confirm(`同一タレントの重複 ${delCount}件を統合します。\n紐付けは「残す方」へ自動で付け替えます。先にバックアップ推奨。\nよろしいですか？`))return;
  try{
    for(const g of dups){
      g.sort((a,b)=>(b.src_id?1:0)-(a.src_id?1:0)); // src_id持ちを優先して残す
      const keep=g[0],keepKey=talentKey(keep);
      for(let i=1;i<g.length;i++){
        const del=g[i],delKey=talentKey(del);
        for(const a of APPS.filter(x=>x.talent_id===delKey)){
          const u={talent_id:keepKey,talent:keep.name,cp:keep.name};
          await updateDoc(doc(db,'appearances',a.id),u); localUpdateApp(a.id,u);
        }
        // 作品側の紐付け（series_master.talents）も残す方のキーへ付け替え
        for(const s of SERIES_M.filter(x=>seriesTalentKeys(x).includes(delKey))){
          const merged=[...new Set(seriesTalentKeys(s).map(k=>k===delKey?keepKey:k))];
          await updateDoc(doc(db,'series_master',s.id),{talents:merged}); localUpdateSeries(s.id,{talents:merged});
        }
        await deleteDoc(doc(db,'talent_master',del.id)); localDeleteTalent(del.id);
      }
    }
    clearC(); renderTalent();
    alert('重複を統合しました。');
  }catch(e){alert('エラー: '+e.message);}
};

window.dedupeSeries=async function(){

  const DEF={'スタジオ':'🎬','カフェ':'☕','レストラン':'🍖','ホテル':'🏨','ショッピング':'🛍️','観光地':'📍','邸宅/スタジオ':'🏛️','寺院':'⛩️','大学':'🎓','図書館':'📚','アート':'🎨','病院':'🏥','スポーツ':'⚽','放送局':'📺','国立公園':'🏞️'};
  const defRows=Object.entries(DEF).map(([name,emoji])=>`
    <tr style="opacity:.6">
      <td><span style="font-size:18px">${emoji}</span></td>
      <td>${name}</td>
      <td style="color:var(--sub);font-size:11px">デフォルト</td>
      <td></td>
    </tr>`).join('');
  const customRows=CAT_M.map(m=>`
    <tr id="cat-row-${m.id}">
      <td style="font-size:18px">${m.emoji||'📍'}</td>
      <td><strong>${m.name}</strong></td>
      <td style="color:var(--green);font-size:11px;font-weight:700">カスタム</td>
      <td><div style="display:flex;gap:5px">
        <button class="btn btn-edit btn-sm" onclick="inlineEditCat('${m.id}')">✏ 編集</button>
        <button class="btn btn-del btn-sm" onclick="delMaster('category_master','${m.id}','category')">🗑</button>
      </div></td>
    </tr>`).join('');
  setBody(`
    <div style="font-size:12px;color:var(--sub);margin-bottom:10px">デフォルト以外のカテゴリーを追加できます。追加したカテゴリーは選択肢に自動で追加されます。</div>
    <div class="add-form-row">
      <div class="form-group"><div class="form-label" style="font-size:10px;margin-bottom:3px">カテゴリー名 <span class="req">*</span></div>
        <input class="mini-input" id="new-cat-name" placeholder="例: 動物園" style="width:160px"></div>
      <div class="form-group"><div class="form-label" style="font-size:10px;margin-bottom:3px">絵文字</div>
        <input class="mini-input" id="new-cat-emoji" value="📍" style="width:60px;font-size:18px;text-align:center"></div>
      <button class="btn btn-primary" style="padding:6px 16px" onclick="addCategory()">＋ 追加</button>
      <div id="new-cat-msg" style="font-size:11px;align-self:center;color:var(--green)"></div>
    </div>
    <table class="master-table">
      <thead><tr><th>絵文字</th><th>カテゴリー名</th><th>種別</th><th>操作</th></tr></thead>
      <tbody>${defRows}${customRows||'<tr><td colspan="4" style="text-align:center;color:var(--sub);padding:12px">カスタムカテゴリーなし</td></tr>'}</tbody>
    </table>`);
};
window.addCategory=async function(){
  const name=document.getElementById('new-cat-name').value.trim();
  const emoji=document.getElementById('new-cat-emoji').value;
  const msg=document.getElementById('new-cat-msg');
  if(!name){msg.style.color='var(--red)';msg.textContent='カテゴリー名を入力してください';return;}
  msg.style.color='var(--purple)';msg.textContent='追加中...';
  try{
    await addDoc(collection(db,'category_master'),{name,emoji});
    clearC(); renderCategory();
  }catch(e){msg.style.color='var(--red)';msg.textContent='エラー: '+e.message;}
};
window.inlineEditCat=function(id){
  const m=CAT_M.find(x=>x.id===id);
  if(!m)return;
  const row=document.getElementById('cat-row-'+id);
  row.classList.add('editing');
  row.innerHTML=`
    <td><input class="mini-input" id="ecat-emoji-${id}" value="${esc(m.emoji||'📍')}" style="width:55px;font-size:18px;text-align:center"></td>
    <td><input class="mini-input" id="ecat-name-${id}" value="${esc(m.name)}" style="width:160px"></td>
    <td style="color:var(--green);font-size:11px;font-weight:700">カスタム</td>
    <td><div style="display:flex;gap:5px">
      <button class="btn btn-primary btn-sm" onclick="saveCat('${id}')">💾 保存</button>
      <button class="btn btn-sm" style="background:#F3F4F6;color:var(--sub)" onclick="renderCategory()">取消</button>
    </div></td>`;
};
window.saveCat=async function(id){
  const name=document.getElementById('ecat-name-'+id)?.value.trim();
  const emoji=document.getElementById('ecat-emoji-'+id)?.value;
  if(!name)return;
  try{
    await updateDoc(doc(db,'category_master',id),{name,emoji});
    clearC(); renderCategory();
  }catch(e){alert('エラー: '+e.message);}
};

// ── Master modal ───────────────────────────────────────────────
window.masterModal=function(type,id){
  const m=id?(type==='cp'?CP_M:type==='series'?SERIES_M:CAT_M).find(x=>x.id===id):{};
  const titles={cp:'💗 CP',series:'🎬 作品',category:'📂 カテゴリー'};
  document.getElementById('modal-title').textContent=(id?'編集: ':'追加: ')+titles[type];
  let body='';
  if(type==='cp'){
    body=`<div class="form-group" style="margin-bottom:10px"><label class="form-label">CP名 <span class="req">*</span></label><input class="form-input" id="m-name" value="${esc(m?.name||'')}" placeholder="例: FreenBecky"></div>
    <div class="form-group" style="margin-bottom:10px"><label class="form-label">テーマカラー</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="color" id="m-cpicker" value="${m?.color||'#EC4899'}" oninput="document.getElementById('m-color').value=this.value" style="width:44px;height:36px;border:none;cursor:pointer;border-radius:8px;padding:2px">
        <input class="form-input" id="m-color" value="${m?.color||'#EC4899'}" oninput="document.getElementById('m-cpicker').value=this.value" style="font-family:monospace">
      </div></div>
    <div class="form-group" style="margin-bottom:14px"><label class="form-label">絵文字</label>
      <input class="form-input" id="m-emoji" value="${esc(m?.emoji||'💗')}" style="font-size:20px;width:80px"></div>`;
  }else if(type==='series'){
    body=`<div class="form-group" style="margin-bottom:10px"><label class="form-label">作品名 / 時期 <span class="req">*</span></label>
      <input class="form-input" id="m-name" value="${esc(m?.name||'')}" placeholder="例: GAP The Series / 2024年秋来日"></div>
    <div class="form-group" style="margin-bottom:14px"><label class="form-label">Thai GL Works ドラマID（任意）</label>
      <input class="form-input" id="m-drama" value="${esc(m?.drama_id||'')}" placeholder="例: GAP または 1774088911045" style="font-family:monospace">
      <div class="form-hint">作品URLの ?drama= の後の値</div></div>`;
  }else{
    body=`<div class="form-group" style="margin-bottom:10px"><label class="form-label">カテゴリー名 <span class="req">*</span></label>
      <input class="form-input" id="m-name" value="${esc(m?.name||'')}" placeholder="例: カフェ"></div>
    <div class="form-group" style="margin-bottom:14px"><label class="form-label">絵文字</label>
      <input class="form-input" id="m-emoji" value="${esc(m?.emoji||'📍')}" style="font-size:20px;width:80px">
      <div class="form-hint">絵文字をそのまま入力してください</div></div>`;
  }
  body+=`<div id="m-msg" class="form-msg"></div><button class="btn btn-primary" style="width:100%" onclick="saveMaster('${type}','${id||''}')">💾 保存</button>`;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal').style.display='flex';
};

window.saveMaster=async function(type,id){
  const msg=document.getElementById('m-msg');
  const name=document.getElementById('m-name')?.value.trim();
  if(!name){msg.style.color='var(--red)';msg.textContent='名前を入力してください';return;}
  msg.style.color='var(--purple)';msg.textContent='保存中...';
  let data={name};
  if(type==='cp'){data.color=document.getElementById('m-color').value;data.emoji=document.getElementById('m-emoji').value;}
  if(type==='series'){data.drama_id=document.getElementById('m-drama').value.trim();}
  if(type==='category'){data.emoji=document.getElementById('m-emoji').value;}
  const colName=type==='cp'?'cp_master':type==='series'?'series_master':'category_master';
  try{
    if(id){await updateDoc(doc(db,colName,id),data);}else{await addDoc(collection(db,colName),data);}
    msg.style.color='var(--green)';msg.textContent='✅ 保存しました';
    clearC();
    setTimeout(()=>{
      closeModal();
      ({cp:renderCp,series:renderSeries,category:renderCategory}[type])();
    },800);
  }catch(e){msg.style.color='var(--red)';msg.textContent='エラー: '+e.message;}
};
window.delMaster=async function(col,id,type){
  if(!confirm('削除しますか？'))return;
  await deleteDoc(doc(db,col,id));
  if(type==='cp')localDeleteCp(id);
  else if(type==='series')localDeleteSeries(id);
  else if(type==='talent')localDeleteTalent(id);
  else localDeleteCat(id);
  clearC();
  ({cp:renderCp,series:renderSeries,category:renderCategory,talent:renderTalent}[type])();
};

// ── Helpers ────────────────────────────────────────────────────
const DEFAULT_CAT_EMOJI={'スタジオ':'🎬','カフェ':'☕','レストラン':'🍖','ホテル':'🏨','ショッピング':'🛍️','観光地':'📍','邸宅/スタジオ':'🏛️','寺院':'⛩️','大学':'🎓','図書館':'📚','アート':'🎨','病院':'🏥','スポーツ':'⚽','放送局':'📺','国立公園':'🏞️'};
function getCatEmoji(cat){const m=CAT_M.find(x=>x.name===cat);return m?.emoji||DEFAULT_CAT_EMOJI[cat]||'📍';}
function buildCatOpts(sel){
  const defs=Object.keys(DEFAULT_CAT_EMOJI);
  const customs=CAT_M.map(m=>m.name).filter(n=>!defs.includes(n));
  return[...defs,...customs].map(c=>`<option value="${c}"${sel===c?' selected':''}>${getCatEmoji(c)} ${c}</option>`).join('');
};
window.updateInlineSeries=function(cpVal,locId){
  const cp=cpVal.trim();
  const dl=document.getElementById('na-series-list-'+locId);
  const hint=document.getElementById('na-series-hint-'+locId);
  if(!dl)return;
  if(!cp){dl.innerHTML=[...new Set([...APPS.map(a=>a.series),...SERIES_M.map(m=>m.name)].filter(Boolean))].sort().map(s=>`<option value="${s}">`).join('');return;}
  const related=[...new Set(APPS.filter(a=>a.cp===cp).map(a=>a.series).filter(Boolean))].sort();
  if(related.length){
    dl.innerHTML=related.map(s=>`<option value="${s}">`).join('');
    if(hint)hint.textContent='💡 '+related.join(' / ');
  }
};
window.updateCpListForSeries=function(seriesVal){
  const series=seriesVal.trim();
  const dl=document.getElementById('a-cplist');
  if(!dl||!series)return;
  const related=[...new Set(APPS.filter(a=>a.series===series).map(a=>a.cp).filter(Boolean))].sort();
  if(related.length)dl.innerHTML=related.map(c=>`<option value="${c}">`).join('');
};

// CP↔作品の連動候補更新
window.updateSeriesListForCp=function(cpVal){
  const cp=cpVal.trim();
  const dl=document.getElementById('a-slist');
  if(!dl)return;
  if(!cp){
    const all=[...new Set([...APPS.map(a=>a.series),...SERIES_M.map(m=>m.name)].filter(Boolean))].sort();
    dl.innerHTML=all.map(s=>`<option value="${s}">`).join('');
    const h=document.getElementById('a-series-hint');if(h)h.textContent='';return;
  }
  const related=[...new Set(APPS.filter(a=>a.cp===cp).map(a=>a.series).filter(Boolean))].sort();
  dl.innerHTML=related.length?related.map(s=>`<option value="${s}">`).join(''):'';
  const h=document.getElementById('a-series-hint');
  if(h)h.textContent=related.length?`💡 ${cp} の登録作品: ${related.join(' / ')}`:'';
};
window.updateCpListForSeries=function(seriesVal){
  const s=seriesVal.trim();
  const dl=document.getElementById('a-cplist');
  if(!dl||!s)return;
  const related=[...new Set(APPS.filter(a=>a.series===s).map(a=>a.cp).filter(Boolean))].sort();
  if(related.length)dl.innerHTML=related.map(c=>`<option value="${c}">`).join('');
};
window.autoCoords=function(url,latId,lngId,msgId){
  const u=url.trim();
  if(!u){const el=document.getElementById(msgId);if(el)el.innerHTML='';return;}
  // 優先度1: !3d!4d → 実際のピンの座標（最も正確）
  let m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  // 優先度2: ?q=lat,lng
  if(!m)m=u.match(/[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  // 優先度3: ll=lat,lng
  if(!m)m=u.match(/ll=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  // 優先度4: /@lat,lng,zoom（マップ中心なので最後の手段）
  if(!m)m=u.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)[,z]/);
  const el=document.getElementById(msgId);
  if(m){
    document.getElementById(latId).value=m[1];
    document.getElementById(lngId).value=m[2];
    if(el){
      el.innerHTML=`<div style="display:flex;align-items:center;gap:6px;color:var(--green);background:#D1FAE5;border-radius:7px;padding:4px 10px">
        <span>✅ 座標を取得: ${m[1]}, ${m[2]}</span>
        <a href="https://www.google.com/maps/search/?api=1&query=${m[1]},${m[2]}" target="_blank"
          style="color:var(--blue);font-weight:700;text-decoration:none;margin-left:auto">地図で確認 ↗</a>
      </div>`;
    }
    // 編集モーダルの場合はステータスも更新
    if(typeof updateEditCoordStatus==='function')updateEditCoordStatus();
    // 新規追加の場合はプレビューも更新
    if(typeof updateCoordPreview==='function')updateCoordPreview();
  } else if(u.includes('maps.app.goo.gl')||u.includes('goo.gl')){
    // 短縮URLの場合は明確にメッセージを表示
    if(el){el.innerHTML=`<div style="color:var(--amber);background:#FEF3C7;border-radius:7px;padding:4px 10px;font-size:11px">
      ⚠ 短縮URL（maps.app.goo.gl）は自動取得できません。<br>
      Googleマップで場所を開き、PCブラウザのアドレスバーのURL（google.com/maps/place/...）をコピーしてください。
    </div>`;}
  } else if(el){
    el.innerHTML=`<div style="color:var(--sub);font-size:11px;padding:2px 0">💡 URLに座標が見つかりません。google.com/maps/place/.../@lat,lng... 形式のURLを使ってください。</div>`;
  }
};
function esc(s){return(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function clearC(){['tsmap_loc_v2','tsmap_app_v2','tsmap_series_v2','tsmap_cp_v1','tsmap_cat_v1'].forEach(k=>localStorage.removeItem(k));clearAdminCache();}
window.closeModal=function(){document.getElementById('modal').style.display='none';};
</script>
