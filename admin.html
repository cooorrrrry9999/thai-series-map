<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thai Series Map — 管理者画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sw:220px;--white:#fff;--bg:#F8FAFC;--text:#111827;--sub:#6B7280;
  --border:#E5E7EB;--hover:#F3F4F6;
  --purple:#9333EA;--pl:#FAF5FF;--pb:#D8B4FE;
  --green:#059669;--red:#DC2626;--blue:#3B82F6;--amber:#D97706;
}
html,body{height:100%;font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text)}

/* Auth gate */
#auth-gate{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.g-btn{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--border);border-radius:12px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:border-color .15s}
.g-btn:hover{border-color:var(--pb)}
.g-btn img{width:20px;height:20px}

/* Layout */
#admin-wrap{display:none;height:100%;flex-direction:row}
.sidebar{width:var(--sw);flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.sb-logo{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
.sb-logo-title{font-size:14px;font-weight:900;color:var(--purple)}
.sb-logo-sub{font-size:11px;color:var(--sub);margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-section{font-size:10px;font-weight:700;color:#bbb;letter-spacing:.1em;padding:12px 16px 4px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);border:none;background:none;width:100%;text-align:left;font-family:inherit;border-radius:0;transition:background .1s;text-decoration:none}
.sb-item:hover{background:var(--hover);color:var(--text)}
.sb-item.active{background:var(--pl);color:var(--purple);font-weight:700}
.sb-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sb-badge{margin-left:auto;background:#EC4899;color:white;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sb-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover}
.sb-user-name{font-size:12px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-logout{font-size:11px;color:var(--sub);background:none;border:none;cursor:pointer;font-family:inherit;flex-shrink:0}

/* Main content */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.page-header{padding:20px 28px 16px;border-bottom:1px solid var(--border);background:var(--white);position:sticky;top:0;z-index:10}
.page-title{font-size:20px;font-weight:900}
.page-sub{font-size:12px;color:var(--sub);margin-top:3px}
.page-body{padding:24px 28px;flex:1}

/* Dashboard cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:14px;padding:18px 20px;border:1px solid var(--border)}
.stat-num{font-size:28px;font-weight:900;line-height:1}
.stat-label{font-size:12px;color:var(--sub);margin-top:4px}
.stat-card.pending .stat-num{color:#EC4899}

/* Table */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search-input{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;min-width:200px}
.search-input:focus{border-color:var(--pb)}
select.filter-sel{padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--white);cursor:pointer}
select.filter-sel:focus{border-color:var(--pb)}

.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:8px 12px;border-bottom:2px solid var(--border);font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.05em;white-space:nowrap}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:hover td{background:var(--hover)}
.data-table tr:last-child td{border-bottom:none}

/* Badges */
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px}
.badge-pub{background:#D1FAE5;color:#059669}
.badge-pend{background:#FEF3C7;color:#D97706}
.badge-rej{background:#FEE2E2;color:#DC2626}
.cp-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}

/* Action buttons */
.btn{padding:5px 12px;border-radius:7px;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;transition:opacity .1s}
.btn:active{opacity:.8}
.btn-edit{background:#EFF6FF;color:var(--blue)}
.btn-del{background:#FEE2E2;color:var(--red)}
.btn-approve{background:#D1FAE5;color:var(--green)}
.btn-reject{background:#FEE2E2;color:var(--red)}
.btn-pub{background:#D1FAE5;color:var(--green)}
.btn-primary{background:linear-gradient(135deg,var(--pb),var(--purple));color:white;padding:8px 20px;font-size:13px;border-radius:10px}
.btn-row{display:flex;gap:6px;align-items:center}

/* Form panel */
.form-panel{background:var(--white);border-radius:14px;border:1px solid var(--border);padding:20px 24px;max-width:720px}
.form-section{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.07em;margin-bottom:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.form-section:first-child{margin-top:0;padding-top:0;border-top:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.three{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:12px;font-weight:700;color:#555}
.req{color:var(--red)}
.form-input,.form-select{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--white);transition:border .15s}
.form-input:focus,.form-select:focus{border-color:var(--pb)}
.form-hint{font-size:11px;color:var(--sub);margin-top:2px}
.form-msg{font-size:12px;text-align:center;min-height:18px;margin:8px 0}
textarea.form-input{resize:vertical;min-height:72px}

/* Master cards */
.master-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:4px}
.master-card{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.master-card-left{flex:1;min-width:0}
.master-card-name{font-size:14px;font-weight:700}
.master-card-meta{font-size:11px;color:var(--sub);margin-top:2px}
.color-swatch{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.1);flex-shrink:0}
.emoji-badge{font-size:22px;flex-shrink:0}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
.modal-box{background:var(--white);border-radius:16px;padding:24px 28px;width:480px;max-height:85vh;overflow-y:auto;animation:scaleIn .2s cubic-bezier(.22,1,.36,1)}
.modal-title{font-size:16px;font-weight:900;margin-bottom:16px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.empty-row td{text-align:center;color:#bbb;padding:32px}
</style>
</head>
<body>

<!-- Auth gate -->
<div id="auth-gate">
  <div style="font-size:48px">🌸</div>
  <div style="font-size:22px;font-weight:900">Thai Series Map 管理者画面</div>
  <div style="font-size:13px;color:var(--sub)">管理者アカウントでログインしてください</div>
  <button class="g-btn" onclick="doLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
    Googleでログイン
  </button>
</div>

<!-- Admin layout -->
<div id="admin-wrap">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-title">🌸 Thai Series Map</div>
      <div class="sb-logo-sub">管理者画面</div>
    </div>
    <div class="sb-nav">
      <div class="sb-section">メイン</div>
      <button class="sb-item active" onclick="showPage('dashboard')" id="nav-dashboard">
        <span class="icon">📊</span>ダッシュボード
      </button>
      <button class="sb-item" onclick="showPage('pending')" id="nav-pending">
        <span class="icon">📬</span>承認待ち
        <span class="sb-badge" id="pending-badge" style="display:none">0</span>
      </button>
      <div class="sb-section">データ管理</div>
      <button class="sb-item" onclick="showPage('locations')" id="nav-locations">
        <span class="icon">📍</span>場所一覧
      </button>
      <button class="sb-item" onclick="showPage('appearances')" id="nav-appearances">
        <span class="icon">🎬</span>紐付け
      </button>
      <button class="sb-item" onclick="showPage('add')" id="nav-add">
        <span class="icon">➕</span>新規追加
      </button>
      <div class="sb-section">マスタ設定</div>
      <button class="sb-item" onclick="showPage('cp')" id="nav-cp">
        <span class="icon">💗</span>CP管理
      </button>
      <button class="sb-item" onclick="showPage('series')" id="nav-series">
        <span class="icon">🎨</span>作品設定
      </button>
      <button class="sb-item" onclick="showPage('category')" id="nav-category">
        <span class="icon">📂</span>カテゴリー
      </button>
    </div>
    <div class="sb-footer">
      <img class="sb-avatar" id="sb-avatar" src="" alt="">
      <div class="sb-user-name" id="sb-uname"></div>
      <button class="sb-logout" onclick="doLogout()">ログアウト</button>
    </div>
  </nav>

  <!-- Main -->
  <div class="main" id="main-area">
    <div class="page-header">
      <div class="page-title" id="page-title">ダッシュボード</div>
      <div class="page-sub" id="page-sub">概要と承認待ちの確認</div>
    </div>
    <div class="page-body" id="page-body">
      <div style="color:var(--sub);text-align:center;padding:40px">読み込み中...</div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, addDoc, setDoc, updateDoc, deleteDoc, serverTimestamp, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB_CFG={apiKey:"AIzaSyARPFANz5DZa6KpEBiw77PCCYPPZghMGeg",authDomain:"thai-gl-works-2c835.firebaseapp.com",databaseURL:"https://thai-gl-works-2c835-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"thai-gl-works-2c835",storageBucket:"thai-gl-works-2c835.firebasestorage.app",messagingSenderId:"71290080508",appId:"1:71290080508:web:47de06018b8617225bdb79"};
const fbApp=initializeApp(FB_CFG);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);
const prov=new GoogleAuthProvider();
const ADMIN="cory92059@gmail.com";

let LOCS=[],APPS=[],SUBS=[],CP_MASTER=[],SERIES_MASTER=[],CAT_MASTER=[];
let currentPage='dashboard';

// ── Auth ──────────────────────────────────────────────────────
window.doLogin=async()=>{try{await signInWithPopup(auth,prov);}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/popup-closed-by-user'){await signInWithRedirect(auth,prov);}else{alert('ログイン失敗: '+e.message);}}};
window.doLogout=async()=>signOut(auth);
getRedirectResult(auth).catch(e=>console.error(e));

onAuthStateChanged(auth,async user=>{
  if(user&&user.email===ADMIN){
    document.getElementById('auth-gate').style.display='none';
    document.getElementById('admin-wrap').style.display='flex';
    document.getElementById('sb-avatar').src=user.photoURL||'';
    document.getElementById('sb-uname').textContent=user.displayName||user.email;
    await loadAll();
    showPage('dashboard');
  } else if(user){
    document.getElementById('auth-gate').innerHTML='<div style="font-size:48px">🚫</div><div style="font-size:18px;font-weight:900;margin:8px">アクセス権限がありません</div><button class="g-btn" onclick="doLogout()">ログアウト</button>';
  } else {
    document.getElementById('auth-gate').style.display='flex';
    document.getElementById('admin-wrap').style.display='none';
  }
});

// ── Data ──────────────────────────────────────────────────────
async function loadAll(){
  const[ls,as,ss,cs,cms,cats]=await Promise.all([
    getDocs(collection(db,'locations')),
    getDocs(collection(db,'appearances')),
    getDocs(collection(db,'location_submissions')),
    getDocs(collection(db,'cp_master')).catch(()=>({docs:[]})),
    getDocs(collection(db,'series_master')).catch(()=>({docs:[]})),
    getDocs(collection(db,'category_master')).catch(()=>({docs:[]})),
  ]);
  LOCS=ls.docs.map(d=>({id:d.id,...d.data()}));
  APPS=as.docs.map(d=>({id:d.id,...d.data()}));
  SUBS=ss.docs.map(d=>({id:d.id,...d.data()}));
  CP_MASTER=cs.docs.map(d=>({id:d.id,...d.data()}));
  SERIES_MASTER=cms.docs.map(d=>({id:d.id,...d.data()}));
  CAT_MASTER=cats.docs.map(d=>({id:d.id,...d.data()}));
  const pending=SUBS.filter(s=>s.status==='未承認').length;
  const badge=document.getElementById('pending-badge');
  badge.style.display=pending?'inline':'none';
  badge.textContent=pending;
}

// ── Navigation ────────────────────────────────────────────────
const PAGE_META={
  dashboard:{title:'ダッシュボード',sub:'概要と承認待ちの確認'},
  pending:{title:'📬 承認待ち',sub:'ファンからの投稿を確認・承認'},
  locations:{title:'📍 場所一覧',sub:'登録済みのスポットを編集'},
  appearances:{title:'🎬 紐付け',sub:'作品とロケ地の紐付けを管理'},
  add:{title:'➕ 新規追加',sub:'新しいスポットを追加'},
  cp:{title:'💗 CP管理',sub:'CP名・テーマカラーを設定'},
  series:{title:'🎨 作品設定',sub:'作品名・Thai GL Worksリンクを設定'},
  category:{title:'📂 カテゴリー',sub:'場所のカテゴリーと絵文字を管理'},
};

window.showPage=function(name){
  currentPage=name;
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+name)?.classList.add('active');
  const m=PAGE_META[name]||{title:name,sub:''};
  document.getElementById('page-title').textContent=m.title;
  document.getElementById('page-sub').textContent=m.sub;
  const renders={dashboard:window.renderDashboard,pending:window.renderPending,locations:window.renderLocations,appearances:window.renderAppearances,add:window.renderAdd,cp:window.renderCp,series:window.renderSeries,category:window.renderCategory};
  (renders[name]||(() => {}))();
};

function setBody(html){document.getElementById('page-body').innerHTML=html;}

// ── Dashboard ─────────────────────────────────────────────────
window.renderDashboard=function(){
  const pending=SUBS.filter(s=>s.status==='未承認');
  const pubApps=APPS.filter(a=>a.status==='公開');
  const cps=[...new Set(APPS.map(a=>a.cp).filter(Boolean))];
  const series=[...new Set(APPS.map(a=>a.series).filter(Boolean))];
  let html=`<div class="stat-grid">
    <div class="stat-card"><div class="stat-num">${LOCS.length}</div><div class="stat-label">📍 登録場所</div></div>
    <div class="stat-card"><div class="stat-num">${pubApps.length}</div><div class="stat-label">🎬 公開中紐付け</div></div>
    <div class="stat-card${pending.length?' pending':''}"><div class="stat-num">${pending.length}</div><div class="stat-label">📬 承認待ち</div></div>
    <div class="stat-card"><div class="stat-num">${cps.length}</div><div class="stat-label">💗 登録CP数</div></div>
  </div>`;
  if(pending.length){
    html+=`<div style="font-size:13px;font-weight:700;margin-bottom:10px;color:#EC4899">⚡ 承認待ちの投稿</div>`;
    html+=pending.slice(0,5).map(s=>pendingCard(s)).join('');
    if(pending.length>5)html+=`<button class="btn btn-edit" onclick="showPage('pending')" style="margin-top:4px">すべて見る（${pending.length}件）→</button>`;
  }
  // CP別件数
  html+=`<div style="font-size:13px;font-weight:700;margin:20px 0 10px">💗 CP別スポット数</div>
  <div class="stat-grid">`;
  cps.forEach(cp=>{
    const cnt=pubApps.filter(a=>a.cp===cp).length;
    const c=CP_MASTER.find(m=>m.name===cp);
    html+=`<div class="stat-card"><div class="stat-num" style="color:${c?.color||'#888'}">${cnt}</div><div class="stat-label">${c?.emoji||'💗'} ${cp}</div></div>`;
  });
  html+='</div>';
  setBody(html);
}

// ── Pending ───────────────────────────────────────────────────
window.renderPending=function(){
  const pending=SUBS.filter(s=>s.status==='未承認');
  if(!pending.length){setBody('<div style="text-align:center;color:var(--sub);padding:60px">承認待ちの投稿はありません 🎉</div>');return;}
  setBody(pending.map(s=>pendingCard(s)).join(''));
}
function pendingCard(s){
  return`<div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
      <div>
        <div style="font-size:15px;font-weight:700;margin-bottom:4px">${s.name}</div>
        <div style="font-size:12px;color:var(--sub);line-height:1.7">${s.series||''} / 💗 ${s.cp||''} / ${s.type||''}<br>${s.scene_desc||''}${s.memo?'<br>💡 '+s.memo:''}</div>
        <div style="font-size:11px;color:#bbb;margin-top:4px">投稿者: ${s.submittedBy||'不明'}</div>
      </div>
      <div class="btn-row" style="flex-shrink:0">
        <button class="btn btn-approve" onclick="approveSub('${s.id}')">✅ 承認</button>
        <button class="btn btn-reject" onclick="rejectSub('${s.id}')">✕ 却下</button>
      </div>
    </div>
  </div>`;
}
window.approveSub=async function(subId){
  const sub=SUBS.find(s=>s.id===subId);
  if(!sub||!confirm('「'+sub.name+'」を承認して公開しますか？'))return;
  try{
    const locRef=doc(collection(db,'locations'));
    await setDoc(locRef,{name:sub.name,lat:sub.lat||0,lng:sub.lng||0,category:sub.category||'観光地',address:sub.address||'',googleMapsUrl:sub.googleMapsUrl||'',memo:sub.memo||''});
    await addDoc(collection(db,'appearances'),{location_id:locRef.id,series:sub.series||'',cp:sub.cp||'',type:sub.type||'作品',scene_desc:sub.scene_desc||'',sns_url:sub.sns_url||'',status:'公開'});
    await updateDoc(doc(db,'location_submissions',subId),{status:'承認済み'});
    clearCaches(); await loadAll(); showPage(currentPage);
  }catch(e){alert('エラー: '+e.message);}
};
window.rejectSub=async function(subId){
  if(!confirm('却下しますか？'))return;
  await updateDoc(doc(db,'location_submissions',subId),{status:'却下'});
  await loadAll(); showPage(currentPage);
};

// ── Locations ─────────────────────────────────────────────────
window.renderLocations=function(){
  const fSeries=document.getElementById('f-loc-series')?.value||'';
  const fCp=document.getElementById('f-loc-cp')?.value||'';
  const fQ=document.getElementById('f-loc-q')?.value?.toLowerCase()||'';
  const allSeries=[...new Set(APPS.map(a=>a.series).filter(Boolean))].sort();
  const allCps=[...new Set(APPS.map(a=>a.cp).filter(Boolean))].sort();
  const filtered=LOCS.filter(loc=>{
    const apps=APPS.filter(a=>a.location_id===loc.id);
    if(fSeries&&!apps.some(a=>a.series===fSeries))return false;
    if(fCp&&!apps.some(a=>a.cp===fCp))return false;
    if(fQ&&!loc.name.toLowerCase().includes(fQ))return false;
    return true;
  });
  let html=`<div class="toolbar">
    <input class="search-input" id="f-loc-q" placeholder="場所名で検索..." oninput="renderLocations()" value="${fQ}">
    <select class="filter-sel" id="f-loc-series" onchange="renderLocations()">
      <option value="">作品で絞込み</option>${allSeries.map(s=>`<option value="${s}"${fSeries===s?' selected':''}>${s}</option>`).join('')}
    </select>
    <select class="filter-sel" id="f-loc-cp" onchange="renderLocations()">

window.addAppToLoc=async function(locId){

window.deleteLoc=async function(locId){
  const loc=LOCS.find(l=>l.id===locId);
  if(!confirm('「'+loc.name+'」を削除しますか？紐付けも削除されます。'))return;
  const batch=writeBatch(db);
  batch.delete(doc(db,'locations',locId));
  APPS.filter(a=>a.location_id===locId).forEach(a=>batch.delete(doc(db,'appearances',a.id)));
  await batch.commit();
  clearCaches(); await loadAll(); renderLocations();
};

window.renderAppearances=function(){

window.addNewSpot=async function(){
  const name=document.getElementById('a-name').value.trim();
  const lat=parseFloat(document.getElementById('a-lat').value)||0;
  const lng=parseFloat(document.getElementById('a-lng').value)||0;
  const cat=document.getElementById('a-cat').value;
  const address=document.getElementById('a-address').value.trim();
  const gmapAuto=document.getElementById('a-gmap-auto').value.trim();
  const url=document.getElementById('a-url').value.trim();
  const memo=document.getElementById('a-memo').value.trim();
  const cp=document.getElementById('a-cp').value.trim();
  const series=document.getElementById('a-series').value.trim();
  const type=document.getElementById('a-type').value;
  const scene=document.getElementById('a-scene').value.trim();
  const sns=document.getElementById('a-sns').value.trim();
  const msg=document.getElementById('add-msg');
  if(!name){msg.style.color='var(--red)';msg.textContent='場所名は必須です';return;}
  if(!lat||!lng){msg.style.color='var(--red)';msg.textContent='緯度・経度を入力してください（GoogleマップのフルURLから自動取得できます）';return;}
  msg.style.color='var(--purple)';msg.textContent='追加中...';
  try{
    const locRef=doc(collection(db,'locations'));
    await setDoc(locRef,{name,lat,lng,category:cat,address,googleMapsUrl:url||gmapAuto,memo});
    if(cp||series||scene){
      await addDoc(collection(db,'appearances'),{location_id:locRef.id,cp,series,type,scene_desc:scene,sns_url:sns,status:'公開'});
    }
    msg.style.color='var(--green)';msg.textContent='✅ 追加しました！';
    clearCaches(); await loadAll();
    ['a-name','a-lat','a-lng','a-address','a-gmap-auto','a-url','a-memo','a-cp','a-series','a-scene','a-sns'].forEach(id=>{document.getElementById(id).value='';});
  }catch(e){msg.style.color='var(--red)';msg.textContent='エラー: '+e.message;}
};

// ── Master CRUD ───────────────────────────────────────────────
window.saveMasterItem=async function(colName, id, type){
  const msg=document.getElementById('m-msg');
  const name=document.getElementById('m-name')?.value.trim();
  if(!name){msg.style.color='var(--red)';msg.textContent='名前を入力してください';return;}
  msg.style.color='var(--purple)';msg.textContent='保存中...';
  try{
    let data={name};
    if(type==='cp'){data.color=document.getElementById('m-color').value;data.emoji=document.getElementById('m-emoji').value;}
    if(type==='series'){data.drama_id=document.getElementById('m-drama').value.trim();}
    if(type==='category'){data.emoji=document.getElementById('m-emoji').value;}
    if(id){await updateDoc(doc(db,colName,id),data);}
    else{await addDoc(collection(db,colName),data);}
    msg.style.color='var(--green)';msg.textContent='✅ 保存しました';
    clearCaches(); await loadAll();
    setTimeout(()=>{closeModal();showPage(type==='cp'?'cp':type==='series'?'series':'category');},800);
  }catch(e){msg.style.color='var(--red)';msg.textContent='エラー: '+e.message;}
};
window.deleteMaster=async function(colName,id,type){
  if(!confirm('削除しますか？'))return;
  await deleteDoc(doc(db,colName,id));
  clearCaches(); await loadAll();
  showPage(type==='cp'?'cp':type==='series'?'series':'category');
};

// ── Helpers ───────────────────────────────────────────────────
function buildCatOptions(selected){
  const defaults=['スタジオ','カフェ','レストラン','ホテル','ショッピング','観光地','邸宅/スタジオ','寺院','大学','図書館','アート','病院','スポーツ','放送局','国立公園'];
  const cats=[...new Set([...defaults,...CAT_MASTER.map(m=>m.name)])].sort();
  return cats.map(c=>`<option value="${c}"${selected===c?' selected':''}>${c}</option>`).join('');
}

window.autoCoords=function(urlVal,latId,lngId,msgId){
  if(!urlVal.trim())return;
  const u=urlVal.trim();
  let m=u.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)[,z]/);
  if(!m)m=u.match(/[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  if(!m)m=u.match(/ll=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  const el=document.getElementById(msgId);
  if(m){
    document.getElementById(latId).value=m[1];
    document.getElementById(lngId).value=m[2];
    if(el){el.style.color='var(--green)';el.textContent='✅ 座標を取得: '+m[1]+', '+m[2];}
  } else if(el){
    el.style.color='var(--sub)';
    el.textContent='💡 短縮URLは自動取得不可。google.com/maps/...のフルURLを使ってください。';
  }
};

function esc(s){return(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function clearCaches(){['tsmap_loc_v2','tsmap_app_v2','tsmap_series_v2','tsmap_cp_v1','tsmap_cat_v1'].forEach(k=>localStorage.removeItem(k));}

window.closeModal=function(e){
  if(!e||e.target===document.getElementById('modal'))document.getElementById('modal').style.display='none';
};
</script>
